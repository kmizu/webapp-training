site_name: Python + PostgreSQL ToDoアプリ研修
site_description: Python の文法は知っているが実用プログラムを書いたことがない人が、小さな ToDo アプリ（FastAPI + PostgreSQL）を写経して完成させる研修テキスト
site_author: 水島宏太
site_url: https://kmizu.github.io/webapp-training/

repo_url: https://github.com/kmizu/webapp-training
repo_name: kmizu/webapp-training
edit_uri: edit/main/docs/

theme:
  name: material
  language: ja
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: ダークモードに切り替え
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: ライトモードに切り替え
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
  font:
    text: Noto Sans JP
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true
      toc_depth: 3

plugins:
  - search:
      lang:
        - ja
        - en

extra_css:
  - stylesheets/extra.css

nav:
  - はじめに: index.md
  - Part 1 復習:
      - 第0章 環境構築: 00-setup.md
      - 第1章 Pythonのおさらい① 型ヒントとdataclass: 01-python-types.md
      - 第2章 Pythonのおさらい② with・モジュール・pytest: 02-python-context.md
      - 第3章 PostgreSQLのおさらい① DDL/DML/SELECT: 03-postgres-ddl-dml.md
      - 第4章 PostgreSQLのおさらい② JOIN・集約・トランザクション: 04-postgres-join-tx.md
  - Part 2 PythonとDBをつなぐ:
      - 第5章 psycopg入門 接続と基本のCRUD: 05-psycopg-basics.md
      - 第6章 プレースホルダとトランザクション: 06-psycopg-tx.md
      - 第7章 dict_rowとコネクションプール: 07-psycopg-pool.md
  - Part 3 ToDoアプリの設計:
      - 第8章 要件・画面・API設計: 08-design-app.md
      - 第9章 テーブル設計とマイグレーション: 09-design-db.md
  - Part 4 データアクセス層:
      - 第10章 ドメインモデルとリポジトリ（Read系）: 10-data-read.md
      - 第11章 リポジトリ（Write系）とタグの多対多: 11-data-write.md
      - 第12章 データアクセス層のテスト: 12-data-tests.md
  - Part 5 Web API:
      - 第13章 FastAPI入門 起動とDI: 13-api-fastapi.md
      - 第14章 CRUD API実装とテスト: 14-api-crud.md
  - Part 6 画面:
      - 第15章 Jinja2でHTML: 15-ui-jinja2.md
      - 第16章 htmxで動的UI: 16-ui-htmx.md
  - Part 7 仕上げ:
      - 第17章 設定・ログ・例外ハンドリング: 17-finishing.md
      - 第18章 公開先と最終課題: 18-deploy.md
  - 付録:
      - 付録A SQLチートシート: appendix-sql.md
      - 付録B 用語集: appendix-glossary.md
